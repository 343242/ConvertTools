[project]
name = "converttools"
version = "0.1.0"
description = "图片格式转换与编辑工具"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
    "psd-tools>=1.9.34",
]

[project.scripts]
converttools = "main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
]
